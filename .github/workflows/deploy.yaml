name: Deploy Vue App to GitHub Pages

on:
  push:
    branches: # Triggers on pushes to vue or vue3 branches
      - vue
      - vue3
  workflow_dispatch:
    inputs:
      deploy_prompt_canary:
        description: "Build and deploy the prompt injection canary"
        required: true
        type: boolean
        default: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to push to the repository

    env:
      VITE_ENABLE_PROMPT_CANARY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_prompt_canary == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm canary gating
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Prompt canary enabled: ${VITE_ENABLE_PROMPT_CANARY}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run build script
        run: npm run build # Replace 'build' with your actual script name from package.json

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jabez007/arcanaeum.git

      - name: Run deploy script
        run: npm run deploy
